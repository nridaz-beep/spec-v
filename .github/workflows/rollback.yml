name: Roll back Spec-V to known stable deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specv-production
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      STABLE_DEPLOYMENT: ${{ vars.SPECV_STABLE_DEPLOYMENT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require recorded stable deployment
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$STABLE_DEPLOYMENT"
      - name: Restore immutable stable deployment without rebuilding
        run: npx --yes vercel@50.4.8 rollback "$STABLE_DEPLOYMENT" --yes --token="$VERCEL_TOKEN"
