<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec-V 管理画面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a30;
    --gold: #b8943a;
    --gold-dim: #7a6228;
    --text: #e8e6e0;
    --muted: #6b6a65;
    --free: #3a8a5a;
    --paid: #b8943a;
    --used: #444;
    --danger: #b03838;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.15em;
    color: var(--gold);
  }

  .logo span { color: var(--muted); font-size: 12px; margin-left: 8px; }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
  }

  .stat-value.free { color: var(--free); }
  .stat-value.paid { color: var(--paid); }

  /* Actions */
  .actions {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-free {
    background: var(--free);
    color: #fff;
  }
  .btn-free:hover { background: #4aaa6a; }

  .btn-paid {
    background: var(--gold);
    color: #000;
  }
  .btn-paid:hover { background: #d4a84a; }

  .btn-outline {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  .search-box {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--gold-dim); }
  .search-box::placeholder { color: var(--muted); }

  /* Filter tabs */
  .filter-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }

  .tab {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }
  .tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .tab:hover:not(.active) { border-color: var(--gold-dim); color: var(--text); }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  td {
    padding: 13px 16px;
    font-size: 13px;
  }

  .token-id {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  .token-id.free { color: var(--free); }
  .token-id.paid { color: var(--paid); }

  .badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .badge-unused { background: rgba(58,138,90,0.15); color: var(--free); border: 1px solid rgba(58,138,90,0.3); }
  .badge-used   { background: rgba(100,100,100,0.15); color: var(--muted); border: 1px solid var(--border); }

  .url-cell {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .copy-btn.copied { border-color: var(--free); color: var(--free); }

  .note-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    width: 160px;
    padding: 2px 4px;
    outline: none;
    transition: border-color 0.15s;
  }
  .note-input:focus { border-bottom-color: var(--gold-dim); color: var(--text); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 420px;
    max-width: 90vw;
  }

  .modal h3 {
    font-size: 16px;
    margin-bottom: 6px;
    color: var(--gold);
    font-family: 'DM Mono', monospace;
  }

  .modal p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .new-token-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  .new-token-id {
    font-family: 'DM Mono', monospace;
    font-size: 32px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .new-token-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .note-field {
    margin-bottom: 20px;
  }

  .note-field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .note-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    outline: none;
  }
  .note-field input:focus { border-color: var(--gold-dim); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 12px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Supabase設定バナー */
  .setup-banner {
    background: rgba(184,148,58,0.08);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 14px 20px;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--gold-dim);
    font-family: 'DM Mono', monospace;
    line-height: 1.6;
  }

  .setup-banner strong { color: var(--gold); }

  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .url-cell { display: none; }
    .search-box { width: 140px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">SPEC-V <span>/ ADMIN</span></div>
  <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)" id="dateDisplay"></div>
</header>

<!-- Supabase未設定の場合の案内 -->
<div class="setup-banner" id="setupBanner">
  ⚙️ <strong>Supabase未接続</strong>　—　
  このデモはローカルデータで動作しています。
  本番運用時は <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を設定してください。
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Total Issued</div>
    <div class="stat-value" id="statTotal">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Free (F)</div>
    <div class="stat-value free" id="statFree">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Paid (P)</div>
    <div class="stat-value paid" id="statPaid">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Completed</div>
    <div class="stat-value" id="statUsed">0</div>
  </div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-free" onclick="openIssueModal('free')">
    ＋ FREE 発行
  </button>
  <button class="btn btn-paid" onclick="openIssueModal('paid')">
    ＋ PAID 発行
  </button>
  <button class="btn btn-outline" onclick="exportCSV()">
    ↓ CSV出力
  </button>
  <input class="search-box" type="text" placeholder="検索（ID・メモ）" oninput="filterTokens(this.value)">
</div>

<!-- Filter tabs -->
<div class="filter-tabs">
  <button class="tab active" onclick="setFilter('all', this)">ALL</button>
  <button class="tab" onclick="setFilter('free', this)">FREE</button>
  <button class="tab" onclick="setFilter('paid', this)">PAID</button>
  <button class="tab" onclick="setFilter('unused', this)">未使用</button>
  <button class="tab" onclick="setFilter('used', this)">受診済</button>
</div>

<!-- Table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>ステータス</th>
        <th>URL</th>
        <th>発行日</th>
        <th>受診日</th>
        <th>メモ</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tokenTable"></tbody>
  </table>
</div>

<!-- Issue Modal -->
<div class="modal-overlay" id="issueModal">
  <div class="modal">
    <h3 id="modalTitle">FREE トークン発行</h3>
    <p id="modalDesc">無料デモ用トークンを発行します。<br>発行後、URLをコピーして津田くんに送ってください。</p>

    <div class="new-token-display">
      <div class="new-token-id" id="newTokenId" style="color:var(--free)">F001</div>
      <div class="new-token-url" id="newTokenUrl"></div>
    </div>

    <div class="note-field">
      <label>メモ（例：津田→山田社長）</label>
      <input type="text" id="noteInput" placeholder="誰に渡すか入力">
    </div>

    <div class="modal-actions">
      <button class="btn btn-free" id="issueConfirmBtn" onclick="issueToken()">発行してURLコピー</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// データストア（Supabase接続前はlocalStorageで代替）
// ============================================================
const SUPABASE_URL = '';  // 本番時に設定
const SUPABASE_KEY = '';  // 本番時に設定
const BASE_URL_FREE = 'https://spec-v.vercel.app/demo';
const BASE_URL_PAID = 'https://spec-v.vercel.app/';

let tokens = JSON.parse(localStorage.getItem('specv_tokens') || '[]');
let currentFilter = 'all';
let currentSearch = '';
let pendingType = 'free';

// ============================================================
// 初期化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dateDisplay').textContent =
    new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit' });

  // デモデータ（空の場合）
  if (tokens.length === 0) {
    tokens = [
      { id:'F001', type:'free', status:'used',   issued_at:'2026-05-16', used_at:'2026-05-17', note:'津田→山田社長' },
      { id:'F002', type:'free', status:'unused', issued_at:'2026-05-16', used_at:'', note:'津田→田中社長' },
      { id:'F003', type:'free', status:'unused', issued_at:'2026-05-16', used_at:'', note:'' },
    ];
    saveTokens();
  }

  renderTable();
  updateStats();
});

// ============================================================
// テーブル描画
// ============================================================
function renderTable() {
  const tbody = document.getElementById('tokenTable');
  const filtered = tokens.filter(t => {
    if (currentFilter === 'free'   && t.type !== 'free')     return false;
    if (currentFilter === 'paid'   && t.type !== 'paid')     return false;
    if (currentFilter === 'unused' && t.status !== 'unused') return false;
    if (currentFilter === 'used'   && t.status !== 'used')   return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      if (!t.id.toLowerCase().includes(q) && !t.note.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  tbody.innerHTML = filtered.map(t => {
    const url = t.type === 'free'
      ? `${BASE_URL_FREE}?token=${t.id}`
      : `${BASE_URL_PAID}?token=${t.id}`;
    const typeClass = t.type === 'free' ? 'free' : 'paid';
    const badge = t.status === 'used'
      ? '<span class="badge badge-used">受診済</span>'
      : '<span class="badge badge-unused">未使用</span>';

    return `
      <tr>
        <td><span class="token-id ${typeClass}">${t.id}</span></td>
        <td>${badge}</td>
        <td><span class="url-cell" title="${url}">${url}</span></td>
        <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${t.issued_at}</td>
        <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${t.used_at || '—'}</td>
        <td>
          <input class="note-input" value="${t.note}"
            onchange="updateNote('${t.id}', this.value)"
            placeholder="メモ追加">
        </td>
        <td>
          <button class="copy-btn" onclick="copyUrl('${url}', this)">URLコピー</button>
        </td>
      </tr>`;
  }).join('');
}

// ============================================================
// Stats更新
// ============================================================
function updateStats() {
  document.getElementById('statTotal').textContent = tokens.length;
  document.getElementById('statFree').textContent  = tokens.filter(t => t.type === 'free').length;
  document.getElementById('statPaid').textContent  = tokens.filter(t => t.type === 'paid').length;
  document.getElementById('statUsed').textContent  = tokens.filter(t => t.status === 'used').length;
}

// ============================================================
// トークン発行
// ============================================================
function openIssueModal(type) {
  pendingType = type;
  const nextId = getNextId(type);
  const url = type === 'free'
    ? `${BASE_URL_FREE}?token=${nextId}`
    : `${BASE_URL_PAID}?token=${nextId}`;

  document.getElementById('modalTitle').textContent  = type === 'free' ? 'FREE トークン発行' : 'PAID トークン発行';
  document.getElementById('modalDesc').textContent   = type === 'free'
    ? '無料デモ用トークンを発行します。\n発行後、URLをコピーして津田くんに送ってください。'
    : '有料版トークンを発行します。（手動発行）';
  document.getElementById('newTokenId').textContent  = nextId;
  document.getElementById('newTokenId').style.color  = type === 'free' ? 'var(--free)' : 'var(--paid)';
  document.getElementById('newTokenUrl').textContent = url;
  document.getElementById('issueConfirmBtn').className = `btn btn-${type === 'free' ? 'free' : 'paid'}`;
  document.getElementById('noteInput').value = '';
  document.getElementById('issueModal').classList.add('show');
}

function closeModal() {
  document.getElementById('issueModal').classList.remove('show');
}

function issueToken() {
  const nextId = getNextId(pendingType);
  const note   = document.getElementById('noteInput').value;
  const url    = pendingType === 'free'
    ? `${BASE_URL_FREE}?token=${nextId}`
    : `${BASE_URL_PAID}?token=${nextId}`;

  tokens.push({
    id: nextId,
    type: pendingType,
    status: 'unused',
    issued_at: new Date().toISOString().slice(0,10),
    used_at: '',
    note: note
  });

  saveTokens();
  renderTable();
  updateStats();
  closeModal();
  copyToClipboard(url);
  showToast(`${nextId} 発行！URLをコピーしました`);
}

function getNextId(type) {
  const prefix = type === 'free' ? 'F' : 'P';
  const existing = tokens.filter(t => t.type === type);
  const num = existing.length + 1;
  return prefix + String(num).padStart(3, '0');
}

// ============================================================
// ユーティリティ
// ============================================================
function copyUrl(url, btn) {
  copyToClipboard(url);
  btn.textContent = 'コピー済！';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'URLコピー'; btn.classList.remove('copied'); }, 2000);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  });
}

function updateNote(id, note) {
  const t = tokens.find(x => x.id === id);
  if (t) { t.note = note; saveTokens(); }
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function filterTokens(q) {
  currentSearch = q;
  renderTable();
}

function saveTokens() {
  localStorage.setItem('specv_tokens', JSON.stringify(tokens));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function exportCSV() {
  const header = 'ID,タイプ,ステータス,発行日,受診日,メモ';
  const rows = tokens.map(t =>
    `${t.id},${t.type === 'free' ? 'FREE' : 'PAID'},${t.status === 'used' ? '受診済' : '未使用'},${t.issued_at},${t.used_at || ''},${t.note}`
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `specv_tokens_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// モーダル外クリックで閉じる
document.getElementById('issueModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
