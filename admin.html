<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Spec-V 管理画面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a30;
    --gold: #b8943a;
    --gold-dim: #7a6228;
    --text: #e8e6e0;
    --muted: #6b6a65;
    --free: #3a8a5a;
    --paid: #b8943a;
    --used: #444;
    --danger: #b03838;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.15em;
    color: var(--gold);
  }

  .logo span { color: var(--muted); font-size: 12px; margin-left: 8px; }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
  }

  .stat-value.free { color: var(--free); }
  .stat-value.paid { color: var(--paid); }

  /* Actions */
  .actions {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-free {
    background: var(--free);
    color: #fff;
  }
  .btn-free:hover { background: #4aaa6a; }

  .btn-paid {
    background: var(--gold);
    color: #000;
  }
  .btn-paid:hover { background: #d4a84a; }

  .btn-outline {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  .search-box {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--gold-dim); }
  .search-box::placeholder { color: var(--muted); }

  /* Filter tabs */
  .filter-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }

  .tab {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }
  .tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .tab:hover:not(.active) { border-color: var(--gold-dim); color: var(--text); }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  td {
    padding: 13px 16px;
    font-size: 13px;
  }

  .token-id {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  .token-id.free { color: var(--free); }
  .token-id.paid { color: var(--paid); }

  .badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .badge-unused { background: rgba(120,120,120,0.12); color: #999; border: 1px solid #444; }
  .badge-pending { background: rgba(184,148,58,0.14); color: #d4a84a; border: 1px solid rgba(184,148,58,0.45); }
  .badge-used { background: rgba(58,138,90,0.15); color: #4aaa6a; border: 1px solid rgba(58,138,90,0.45); }

  .status-control {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 190px;
  }

  .status-select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    padding: 5px 24px 5px 8px;
    outline: none;
  }
  .status-select:focus { border-color: var(--gold-dim); }
  .status-select:disabled { cursor: wait; opacity: 0.55; }

  .url-cell {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .copy-btn.copied { border-color: var(--free); color: var(--free); }

  .note-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    width: 160px;
    padding: 2px 4px;
    outline: none;
    transition: border-color 0.15s;
  }
  .note-input:focus { border-bottom-color: var(--gold-dim); color: var(--text); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 420px;
    max-width: 90vw;
  }

  .modal h3 {
    font-size: 16px;
    margin-bottom: 6px;
    color: var(--gold);
    font-family: 'DM Mono', monospace;
  }

  .modal p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .new-token-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  .new-token-id {
    font-family: 'DM Mono', monospace;
    font-size: 32px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .new-token-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .note-field {
    margin-bottom: 20px;
  }

  .note-field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .note-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    outline: none;
  }
  .note-field input:focus { border-color: var(--gold-dim); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 12px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at top, rgba(184,148,58,0.14), transparent 36%), rgba(13,13,15,0.96);
  }
  .auth-card {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid rgba(184,148,58,0.32);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .auth-card h1 {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .auth-card p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 18px; }
  .auth-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
  }
  .auth-input:focus { border-color: var(--gold); }
  .auth-error { min-height: 18px; color: var(--danger); font-size: 12px; margin-top: 10px; }
  .admin-shell.locked { display: none; }

  .department-panel {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    align-items: end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .department-field label { display:block; color:var(--muted); font-size:10px; margin-bottom:6px; letter-spacing:.08em; }
  .department-field input, .department-field select { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:10px 12px; font:13px 'Noto Sans JP',sans-serif; }
  .department-field input:focus, .department-field select:focus { outline:none; border-color:var(--gold-dim); }
  .department-list { grid-column:1 / -1; color:var(--muted); font-size:12px; line-height:1.7; }

  @media (max-width: 768px) {
    body { padding: 18px 14px 28px; }
    header { flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 24px; }
    .logo { font-size: 18px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
    .stat-card { padding: 13px 14px; }
    .stat-value { font-size: 24px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions .btn { justify-content: center; width: 100%; padding: 12px 10px; font-size: 12px; }
    .actions .btn-outline { grid-column: span 2; }
    .search-box { grid-column: span 2; width: 100%; margin-left: 0; padding: 12px 14px; font-size: 14px; }
    .filter-tabs { overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .tab { flex: 0 0 auto; padding: 8px 13px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
    table { min-width: 760px; }
    thead th, td { padding: 11px 12px; }
    .url-cell { max-width: 220px; }
    .status-control { min-width: 178px; }
    .note-input { width: 140px; }
    .modal { width: calc(100vw - 28px); max-width: none; padding: 24px 20px; }
    .modal-actions { flex-direction: column; }
    .modal-actions .btn { width: 100%; justify-content: center; }
    .new-token-id { font-size: 28px; }
    .toast { left: 14px; right: 14px; bottom: 14px; text-align: center; }
    .department-panel { grid-template-columns: 1fr 1fr; }
    .department-panel .btn { grid-column: 1 / -1; justify-content:center; }
  }

  @media (max-width: 430px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat-label { font-size: 10px; }
    .actions { grid-template-columns: 1fr; }
    .actions .btn-outline, .search-box { grid-column: auto; }
  }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <form class="auth-card" id="authForm">
    <h1>SPEC-V ADMIN</h1>
    <p>管理画面を開くためのパスワードを入力してください。認証後、このブラウザのタブ内だけ有効になります。</p>
    <input class="auth-input" id="adminPasswordInput" type="password" autocomplete="current-password" placeholder="管理パスワード">
    <button class="btn btn-paid" type="submit" style="width:100%;justify-content:center;padding:12px 16px;">ログイン</button>
    <div class="auth-error" id="authError"></div>
  </form>
</div>

<div class="admin-shell locked" id="adminShell">
<header>
  <div class="logo">SPEC-V <span>/ ADMIN</span></div>
  <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)" id="dateDisplay"></div>
</header>

<!-- Stats -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Total Issued</div>
    <div class="stat-value" id="statTotal">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Free (F)</div>
    <div class="stat-value free" id="statFree">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Paid (P)</div>
    <div class="stat-value paid" id="statPaid">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Completed</div>
    <div class="stat-value" id="statUsed">0</div>
  </div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-free" onclick="openIssueModal('free')">
    ＋ FREE 発行
  </button>
  <button class="btn btn-paid" onclick="openIssueModal('paid')">
    ＋ PAID 発行
  </button>
  <button class="btn btn-outline" onclick="exportCSV()">
    ↓ CSV出力
  </button>
  <input class="search-box" type="text" placeholder="検索（ID・メモ）" oninput="filterTokens(this.value)">
</div>

<section class="department-panel" aria-labelledby="departmentTitle">
  <div class="department-field">
    <label id="departmentTitle" for="orgInput">組織ID</label>
    <input id="orgInput" type="text" placeholder="例：company-a">
  </div>
  <div class="department-field">
    <label for="departmentNameInput">部署名</label>
    <input id="departmentNameInput" type="text" placeholder="例：営業部">
  </div>
  <div class="department-field">
    <label for="departmentTargetInput">対象人数</label>
    <input id="departmentTargetInput" type="number" min="0" step="1" value="0">
  </div>
  <button class="btn btn-outline" type="button" onclick="registerDepartment()">部署を登録</button>
  <div class="department-list" id="departmentList">登録済み部署を読み込み中…</div>
</section>

<!-- Filter tabs -->
<div class="filter-tabs">
  <button class="tab active" onclick="setFilter('all', this)">ALL</button>
  <button class="tab" onclick="setFilter('free', this)">FREE</button>
  <button class="tab" onclick="setFilter('paid', this)">PAID</button>
  <button class="tab" onclick="setFilter('unused', this)">未使用</button>
  <button class="tab" onclick="setFilter('pending', this)">未受診</button>
  <button class="tab" onclick="setFilter('used', this)">受診済</button>
</div>

<!-- Table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>ステータス</th>
        <th>URL</th>
        <th>発行日</th>
        <th>受診日</th>
        <th>メモ</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tokenTable"></tbody>
  </table>
</div>

<!-- Issue Modal -->
<div class="modal-overlay" id="issueModal">
  <div class="modal">
    <h3 id="modalTitle">FREE トークン発行</h3>
    <p id="modalDesc">無料デモ用トークンを発行します。<br>発行後、URLをコピーして津田くんに送ってください。</p>

    <div class="new-token-display">
      <div class="new-token-id" id="newTokenId" style="color:var(--free)">F001</div>
      <div class="new-token-url" id="newTokenUrl"></div>
    </div>

    <div class="note-field">
      <label>メモ（例：津田→山田社長）</label>
      <input type="text" id="noteInput" placeholder="誰に渡すか入力">
    </div>

    <div class="note-field">
      <label for="departmentSelect">部署（任意）</label>
      <select id="departmentSelect" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:13px;">
        <option value="">部署を指定しない</option>
      </select>
    </div>
    <div class="note-field">
      <label for="announcedAtInput">告知日・期限（任意）</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <input type="date" id="announcedAtInput" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:13px;">
        <input type="date" id="deadlineInput" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:13px;">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-free" id="issueConfirmBtn" onclick="issueToken()">発行してURLコピー</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>
</div>

<script>
// ============================================================
// データストア
// ============================================================
const ADMIN_TOKENS_API = '/api/admin-tokens';
const ADMIN_PASSWORD_KEY = 'specv_admin_password';
const BASE_URL_FREE = 'https://spec-v.vercel.app/main.html';
const BASE_URL_PAID = 'https://spec-v.vercel.app/main.html';
const STATUS_META = Object.freeze({
  unused: Object.freeze({ label: '未使用', badgeClass: 'badge-unused' }),
  pending: Object.freeze({ label: '未受診', badgeClass: 'badge-pending' }),
  used: Object.freeze({ label: '受診済', badgeClass: 'badge-used' })
});

let tokens = [];
let currentFilter = 'all';
let currentSearch = '';
let pendingType = 'free';
let departments = [];
const ADMIN_DEPARTMENTS_API = '/api/admin-departments';

// ============================================================
// 初期化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dateDisplay').textContent =
    new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit' });

  document.getElementById('authForm').addEventListener('submit', handleAdminLogin);
  const savedPassword = sessionStorage.getItem(ADMIN_PASSWORD_KEY);
  if (savedPassword) unlockAdmin(savedPassword);
});

async function handleAdminLogin(event) {
  event.preventDefault();
  const input = document.getElementById('adminPasswordInput');
  const error = document.getElementById('authError');
  const password = input.value.trim();
  if (!password) {
    error.textContent = 'パスワードを入力してください';
    input.focus();
    return;
  }
  error.textContent = '';
  await unlockAdmin(password, true);
}

async function unlockAdmin(password, showErrors = false) {
  const error = document.getElementById('authError');
  try {
    await loadTokens(password);
    await loadDepartments(password);
    sessionStorage.setItem(ADMIN_PASSWORD_KEY, password);
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('adminShell').classList.remove('locked');
  } catch (err) {
    console.error(err);
    sessionStorage.removeItem(ADMIN_PASSWORD_KEY);
    document.getElementById('authOverlay').style.display = 'flex';
    document.getElementById('adminShell').classList.add('locked');
    if (showErrors) error.textContent = err.message === 'unauthorized' ? 'パスワードが違います' : '管理APIに接続できませんでした';
  }
}

async function loadTokens(password) {
  try {
    const data = await requestAdminTokens({ password });
    tokens = Array.isArray(data.tokens) ? data.tokens : [];
    renderTable();
    updateStats();
  } catch (error) {
    console.error(error);
    showToast('トークン一覧を読み込めませんでした');
  }
}

async function loadDepartments(password) {
  try {
    const data = await requestAdminDepartments({ password });
    departments = Array.isArray(data.departments) ? data.departments : [];
    renderDepartmentOptions();
    document.getElementById('departmentList').textContent = departments.length
      ? departments.map(d => `${d.org_id} / ${d.name}（対象${d.target_count}人）`).join('　')
      : '登録済み部署はありません。';
  } catch (error) {
    console.error(error);
    document.getElementById('departmentList').textContent = '部署情報を読み込めませんでした。';
  }
}

function renderDepartmentOptions() {
  const select = document.getElementById('departmentSelect');
  if (!select) return;
  select.innerHTML = '<option value="">部署を指定しない</option>' + departments.map(d => `<option value="${escapeHtml(d.id)}">${escapeHtml(d.org_id)} / ${escapeHtml(d.name)}</option>`).join('');
}

async function registerDepartment() {
  const orgId = document.getElementById('orgInput').value.trim();
  const name = document.getElementById('departmentNameInput').value.trim();
  const targetCount = Number(document.getElementById('departmentTargetInput').value || 0);
  if (!orgId || !name || !Number.isInteger(targetCount) || targetCount < 0) {
    showToast('組織ID・部署名・対象人数を確認してください');
    return;
  }
  try {
    const data = await requestAdminDepartments({ method:'POST', body:{ org_id:orgId, name, target_count:targetCount } });
    departments.push(data.department);
    renderDepartmentOptions();
    document.getElementById('departmentList').textContent = departments.map(d => `${d.org_id} / ${d.name}（対象${d.target_count}人）`).join('　');
    document.getElementById('departmentNameInput').value = '';
    document.getElementById('departmentTargetInput').value = '0';
    showToast('部署を登録しました');
  } catch (error) {
    console.error(error);
    showToast('部署を登録できませんでした');
  }
}

// ============================================================
// テーブル描画
// ============================================================
function renderTable() {
  const tbody = document.getElementById('tokenTable');
  const filtered = tokens.filter(t => {
    if (currentFilter === 'free'   && t.type !== 'free')     return false;
    if (currentFilter === 'paid'   && t.type !== 'paid')     return false;
    if (currentFilter === 'unused' && t.status !== 'unused') return false;
    if (currentFilter === 'pending' && t.status !== 'pending') return false;
    if (currentFilter === 'used'   && t.status !== 'used')   return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      if (!t.id.toLowerCase().includes(q) && !t.note.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  tbody.innerHTML = filtered.map(t => {
    const url = t.type === 'free'
      ? `${BASE_URL_FREE}?token=${t.id}`
      : `${BASE_URL_PAID}?token=${t.id}`;
    const typeClass = t.type === 'free' ? 'free' : 'paid';
    const status = normalizeStatus(t.status);
    const statusMeta = STATUS_META[status];
    const badge = `<span class="badge ${statusMeta.badgeClass}" data-status="${status}">${statusMeta.label}</span>`;
    const statusSelect = `
      <select class="status-select" aria-label="${t.id}のステータス"
        onchange="updateStatus('${t.id}', this.value, this)">
        ${Object.entries(STATUS_META).map(([value, meta]) =>
          `<option value="${value}"${status === value ? ' selected' : ''}>${meta.label}</option>`
        ).join('')}
      </select>`;

    return `
      <tr>
        <td><span class="token-id ${typeClass}">${t.id}</span></td>
        <td><div class="status-control">${badge}${statusSelect}</div></td>
        <td><span class="url-cell" title="${url}">${url}</span></td>
        <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${t.issued_at || '—'}</td>
        <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">—</td>
        <td>
          <input class="note-input" value="${escapeHtml(t.note || '')}"
            onchange="updateNote('${t.id}', this.value)"
            placeholder="メモ追加">
        </td>
        <td>
          <button class="copy-btn" onclick="copyUrl('${url}', this)">URLコピー</button>
        </td>
      </tr>`;
  }).join('');
}

// ============================================================
// Stats更新
// ============================================================
function updateStats() {
  document.getElementById('statTotal').textContent = tokens.length;
  document.getElementById('statFree').textContent  = tokens.filter(t => t.type === 'free').length;
  document.getElementById('statPaid').textContent  = tokens.filter(t => t.type === 'paid').length;
  document.getElementById('statUsed').textContent  = tokens.filter(t => t.status === 'used').length;
}

// ============================================================
// トークン発行
// ============================================================
function openIssueModal(type) {
  pendingType = type;
  const nextId = getNextId(type);
  const url = type === 'free'
    ? `${BASE_URL_FREE}?token=${nextId}`
    : `${BASE_URL_PAID}?token=${nextId}`;

  document.getElementById('modalTitle').textContent  = type === 'free' ? 'FREE トークン発行' : 'PAID トークン発行';
  document.getElementById('modalDesc').textContent   = type === 'free'
    ? '無料デモ用トークンを発行します。\n発行後、URLをコピーして津田くんに送ってください。'
    : '有料版トークンを発行します。（手動発行）';
  document.getElementById('newTokenId').textContent  = nextId;
  document.getElementById('newTokenId').style.color  = type === 'free' ? 'var(--free)' : 'var(--paid)';
  document.getElementById('newTokenUrl').textContent = url;
  document.getElementById('issueConfirmBtn').className = `btn btn-${type === 'free' ? 'free' : 'paid'}`;
  document.getElementById('noteInput').value = '';
  document.getElementById('issueModal').classList.add('show');
}

function closeModal() {
  document.getElementById('issueModal').classList.remove('show');
}

async function issueToken() {
  const nextId = getNextId(pendingType);
  const note   = document.getElementById('noteInput').value;
  const departmentId = document.getElementById('departmentSelect').value;
  const department = departments.find(item => item.id === departmentId);
  const announcedAt = document.getElementById('announcedAtInput').value;
  const deadline = document.getElementById('deadlineInput').value;
  const url    = pendingType === 'free'
    ? `${BASE_URL_FREE}?token=${nextId}`
    : `${BASE_URL_PAID}?token=${nextId}`;

  try {
    const data = await requestAdminTokens({
      method: 'POST',
      body: {
        id: nextId,
        type: pendingType,
        status: 'unused',
        issued_at: new Date().toISOString(),
        note,
        org_id: department ? department.org_id : '',
        department_id: departmentId,
        announced_at: announcedAt ? `${announcedAt}T00:00:00.000Z` : null,
        deadline: deadline ? `${deadline}T23:59:59.999Z` : null,
        announced_by: sessionStorage.getItem(ADMIN_PASSWORD_KEY) ? 'admin' : ''
      }
    });

    tokens.push(data.token);
    renderTable();
    updateStats();
    closeModal();
    copyToClipboard(url);
    showToast(`${nextId} 発行！URLをコピーしました`);
  } catch (error) {
    console.error(error);
    showToast(`${nextId} を発行できませんでした`);
  }
}

function getNextId(type) {
  const prefix = type === 'free' ? 'F' : 'P';
  const existingNumbers = tokens
    .filter(t => t.type === type && String(t.id || '').startsWith(prefix))
    .map(t => Number(String(t.id).slice(1)))
    .filter(Number.isFinite);
  const num = existingNumbers.length > 0 ? Math.max(...existingNumbers) + 1 : 1;
  return prefix + String(num).padStart(3, '0');
}

// ============================================================
// ユーティリティ
// ============================================================
function copyUrl(url, btn) {
  copyToClipboard(url);
  btn.textContent = 'コピー済！';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'URLコピー'; btn.classList.remove('copied'); }, 2000);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  });
}

async function updateNote(id, note) {
  const t = tokens.find(x => x.id === id);
  if (!t) return;

  const previousNote = t.note;
  t.note = note;

  try {
    const data = await requestAdminTokens({ method: 'PATCH', body: { id, note } });
    Object.assign(t, data.token);
    renderTable();
    showToast('メモを保存しました');
  } catch (error) {
    console.error(error);
    t.note = previousNote;
    renderTable();
    showToast('メモを保存できませんでした');
  }
}

async function updateStatus(id, status, select) {
  const token = tokens.find(t => t.id === id);
  if (!token || !STATUS_META[status] || normalizeStatus(token.status) === status) return;

  const previousStatus = token.status;
  select.disabled = true;

  try {
    const data = await requestAdminTokens({ method: 'PATCH', body: { id, status } });
    Object.assign(token, data.token);
    renderTable();
    updateStats();
    showToast(`${id} を${getStatusLabel(status)}に変更しました`);
  } catch (error) {
    console.error(error);
    token.status = previousStatus;
    renderTable();
    showToast(`${id} のステータスを変更できませんでした`);
  }
}

function getStatusLabel(status) {
  return STATUS_META[normalizeStatus(status)].label;
}

function normalizeStatus(status) {
  return Object.prototype.hasOwnProperty.call(STATUS_META, status) ? status : 'unused';
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function filterTokens(q) {
  currentSearch = q;
  renderTable();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function exportCSV() {
  const header = 'ID,タイプ,ステータス,発行日,受診日,メモ';
  const rows = tokens.map(t =>
    `${t.id},${t.type === 'free' ? 'FREE' : 'PAID'},${getStatusLabel(t.status)},${t.issued_at || ''},,${t.note || ''}`
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `specv_tokens_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function requestAdminTokens(options = {}) {
  const password = options.password || sessionStorage.getItem(ADMIN_PASSWORD_KEY) || '';
  const headers = { 'x-admin-password': password };
  if (options.body) headers['Content-Type'] = 'application/json';

  const response = await fetch(ADMIN_TOKENS_API, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (response.status === 401) throw new Error('unauthorized');
    throw new Error(data.error || `request_failed_${response.status}`);
  }
  return data;
}

async function requestAdminDepartments(options = {}) {
  const password = options.password || sessionStorage.getItem(ADMIN_PASSWORD_KEY) || '';
  const headers = { 'x-admin-password': password };
  if (options.body) headers['Content-Type'] = 'application/json';
  const response = await fetch(ADMIN_DEPARTMENTS_API, { method: options.method || 'GET', headers, body: options.body ? JSON.stringify(options.body) : undefined });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (response.status === 401) throw new Error('unauthorized');
    throw new Error(data.error || `request_failed_${response.status}`);
  }
  return data;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('"', '&quot;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

// モーダル外クリックで閉じる
document.getElementById('issueModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
