<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spec-V | ご案内</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; }
    main { width: min(92vw, 560px); box-sizing: border-box; padding: 40px 28px; text-align: center; background: #fff; border: 1px solid #e2e7f0; border-radius: 16px; box-shadow: 0 12px 32px rgba(23, 32, 51, .08); }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    p { margin: 0; line-height: 1.8; }
    a { display: inline-block; margin-top: 24px; color: #315bd6; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">ご購入ありがとうございました</h1>
    <p id="message">診断URLをメールでお送りしました。メールをご確認ください。</p>
    <a href="/main.html">Spec-Vトップへ戻る</a>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('checkout') === 'cancel') {
      document.getElementById('title').textContent = '決済はキャンセルされました';
      document.getElementById('message').textContent = '料金は発生していません。必要であれば、もう一度お試しください。';
    }
  </script>
</body>
</html>
