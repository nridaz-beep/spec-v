name: Promote verified Spec-V
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specv-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/specv-check.yml
  promote:
    needs: checks
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
      - name: Verify exact tested sources and LATEST
        run: node scripts/release-evidence.cjs verify
      - name: Require deployment configuration
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - run: npx --yes vercel@50.4.8 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@50.4.8 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified build
        run: npx --yes vercel@50.4.8 deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment-url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ github.sha }}
          path: deployment-url.txt
          if-no-files-found: error
