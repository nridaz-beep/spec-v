name: Spec-V checks

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release:evidence
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-evidence-${{ github.sha }}
          path: .release-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
  quality-gate:
    name: Spec-V quality gate
    if: always()
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on failure, cancellation or skipped tests
        env:
          RESULT: ${{ needs.regression.result }}
        run: test "$RESULT" = success
